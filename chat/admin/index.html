<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0b1220">
<title>Admin · Asistente DL COMPANY</title>
<link rel="icon" href="../../assets/dl-company.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{--fondo:#070c18;--panel:#0f1729;--panel2:#16213a;--borde:rgba(255,255,255,.09);--oro:#d4af37;--oro2:#f5d77a;
    --texto:#e8eefc;--sub:#8ea0c8;--azul:#2563eb;--verde:#22c55e;--rojo:#ef4444}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--fondo);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  button,input,textarea,select{font:inherit;color:inherit}
  .oculto{display:none!important}
  /* --- login --- */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .tarjeta{width:100%;max-width:380px;background:var(--panel);border:1px solid rgba(212,175,55,.35);border-radius:20px;padding:26px 22px;text-align:center}
  .tarjeta img{width:76px;height:76px;object-fit:contain}
  .tarjeta h1{font-size:20px;margin:10px 0 4px}.tarjeta p{color:var(--sub);font-size:13.5px;margin-bottom:18px;line-height:1.4}
  .tarjeta form{display:flex;flex-direction:column;gap:10px;text-align:left}
  label{font-size:12.5px;color:var(--sub);font-weight:600;display:block;margin-bottom:5px}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],textarea{width:100%;background:#0b1324;border:1px solid var(--borde);
    border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
  input:focus,textarea:focus{border-color:rgba(212,175,55,.7)}
  textarea{min-height:110px;resize:vertical;line-height:1.4}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--panel2);border:1px solid var(--borde)}
  .btn.oro{background:linear-gradient(135deg,var(--oro),var(--oro2));color:#1a1405;border:0}
  .btn.azul{background:var(--azul);border:0;color:#fff}
  .btn.rojo{background:transparent;border:1px solid rgba(239,68,68,.6);color:#ff8a8a}
  .btn.peq{padding:8px 11px;font-size:13px;border-radius:10px}
  .error{color:#ff8a8a;font-size:13.5px;min-height:18px}
  /* --- app --- */
  header{position:sticky;top:0;z-index:5;background:rgba(7,12,24,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--borde);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  header img{width:34px;height:34px;object-fit:contain}
  .htit{flex:1;min-width:0}.htit b{display:block;font-size:15px}.htit span{font-size:12px;color:var(--sub)}
  .htit span.sucio{color:var(--oro2)}
  main{max-width:760px;margin:0 auto;padding:14px 14px 110px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0b1220;border-top:1px solid var(--borde);display:flex;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:0;padding:6px 2px;font-size:11.5px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
  nav button i{font-style:normal;font-size:20px}
  nav button.on{color:var(--oro2)}
  .globo{position:absolute;top:0;right:calc(50% - 22px);background:var(--rojo);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 6px;font-weight:700}
  h2{font-size:18px;margin:4px 0 4px}
  .ayuda{color:var(--sub);font-size:13px;line-height:1.45;margin-bottom:14px}
  .lista{display:flex;flex-direction:column;gap:9px}
  .item{background:var(--panel);border:1px solid var(--borde);border-radius:14px;padding:12px 13px;cursor:pointer;display:flex;gap:10px;align-items:center}
  .item:active{transform:scale(.99)}
  .item .txt{flex:1;min-width:0}.item b{display:block;font-size:14.5px;line-height:1.3}
  .item small{color:var(--sub);font-size:12px;display:block;margin-top:4px;line-height:1.4}
  .etq{display:inline-block;font-size:11px;border-radius:8px;padding:2px 7px;margin:4px 4px 0 0;background:rgba(37,99,235,.18);color:#9cc0ff}
  .etq.oro{background:rgba(212,175,55,.15);color:var(--oro2)}
  .flecha{color:var(--sub);font-size:18px}
  .campo{margin-bottom:13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--borde);background:var(--panel2);border-radius:18px;padding:7px 11px;font-size:13px;cursor:pointer}
  .chip.on{border-color:var(--oro);background:rgba(212,175,55,.16);color:var(--oro2);font-weight:700}
  .fila{display:flex;gap:8px;align-items:center}
  .interruptor{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--borde);
    border-radius:12px;padding:11px 12px;margin-bottom:10px;cursor:pointer}
  .interruptor span{font-size:14px;line-height:1.35}.interruptor small{display:block;color:var(--sub);font-size:12px}
  .sw{width:46px;height:27px;border-radius:14px;background:#2a3550;position:relative;flex:none;transition:.2s}
  .sw:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
  .on>.sw{background:var(--verde)}.on>.sw:after{left:22px}
  .bloque{background:var(--panel);border:1px solid var(--borde);border-radius:14px;padding:13px;margin-bottom:12px}
  .plan{background:#0b1324;border:1px solid var(--borde);border-radius:12px;padding:10px;margin-bottom:8px}
  .plan .fila input{min-width:0}
  details.app{background:var(--panel);border:1px solid var(--borde);border-radius:14px;margin-bottom:10px;overflow:hidden}
  details.app summary{padding:13px;cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:9px}
  details.app summary::-webkit-details-marker{display:none}
  details.app summary:after{content:"▾";margin-left:auto;color:var(--sub)}
  details.app[open] summary:after{content:"▴"}
  details.app .cuerpo{padding:0 13px 13px}
  .vacio{text-align:center;color:var(--sub);padding:30px 10px;font-size:14px;line-height:1.5}
  /* hoja de edición */
  .hoja-fondo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
  .hoja{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--fondo);border-top:1px solid rgba(212,175,55,.45);
    border-radius:20px 20px 0 0;z-index:21;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
  @media(min-width:760px){.hoja{left:50%;right:auto;width:720px;transform:translateX(-50%)}}
  .hoja-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}.hoja-cab h3{flex:1;font-size:17px}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .aviso{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#14532d;color:#d1fae5;
    border-radius:12px;padding:11px 16px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
  .aviso.mal{background:#7f1d1d;color:#fee2e2}
  code{background:#0b1324;border:1px solid var(--borde);border-radius:6px;padding:1px 5px;font-size:12.5px;color:var(--oro2)}
</style>
</head>
<body>

<!-- ============ INGRESO ============ -->
<section id="login">
  <div class="tarjeta">
    <img src="../../assets/dl-company.png" alt="DL COMPANY">
    <h1>Administrar asistente</h1>
    <p>Ingresa con tu cuenta de administrador de DL COMPANY (la misma de DL CUADRA PRO).</p>
    <form id="fLogin">
      <div><label for="lEmail">Correo</label><input id="lEmail" type="email" autocomplete="username" value="d.l.company.2026@gmail.com" required></div>
      <div><label for="lPass">Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="error" id="lErr"></div>
      <button class="btn oro" id="lBtn">Ingresar</button>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="oculto">
  <header>
    <img src="../../assets/dl-company.png" alt="">
    <div class="htit"><b>Asistente</b><span id="estado">Todo guardado ✓</span></div>
    <button class="btn peq" id="bProbar" title="Probar el chat con estos cambios">▶ Probar</button>
    <button class="btn oro peq" id="bGuardar">💾 Guardar</button>
  </header>
  <main id="vista"></main>
  <nav>
    <button data-t="casos"><i>📥</i>Casos<span class="globo oculto" id="nCasos"></span></button>
    <button data-t="respuestas" class="on"><i>💬</i>Respuestas</button>
    <button data-t="apps"><i>📱</i>Apps y planes</button>
    <button data-t="pendientes"><i>❓</i>Sin resp.<span class="globo oculto" id="nPend"></span></button>
    <button data-t="ajustes"><i>⚙️</i>Ajustes</button>
  </nav>
</section>

<div id="hoja" class="oculto"></div>

<script>window.DL_CHAT_APP = 'web';</script>
<script src="../dl-chat.js"></script>
<script>
(function () {
  'use strict';
  var ADMIN = 'd.l.company.2026@gmail.com';
  var sb = supabase.createClient('https://geesohvgkqhhlxdnovfb.supabase.co', 'sb_publishable_oozUfY-BnwMxOnoUCmfBgg_INhu8KKd', {
    auth: { storageKey: 'dlchat-admin-auth', persistSession: true, autoRefreshToken: true },
  });
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var copiar = function (o) { return JSON.parse(JSON.stringify(o)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim(); };

  var guardado = null, draft = null, sucio = false, tab = 'respuestas', pendientes = [], usuario = null;
  var filtroApp = '', filtroTexto = '';
  var casos = [], filtroCasos = 'pendientes', avisosActivos = false;
  var URL_PUSH = 'https://geesohvgkqhhlxdnovfb.supabase.co/functions/v1/push-chatbot';
  var VAPID = 'BNMIHlUAXQFENegoZu-9q-LFiOhrm6bFQPRMySD4vK9ba3dhy44BRXFNifZ9vPB-r76W-mufEVZeD6X1s7wvgrc';

  /* ---------------- avisos ---------------- */
  var tAviso;
  function aviso(msg, mal) {
    var d = $('.aviso') || document.body.appendChild(Object.assign(document.createElement('div'), { className: 'aviso' }));
    d.textContent = msg; d.classList.toggle('mal', !!mal); d.classList.remove('oculto');
    clearTimeout(tAviso); tAviso = setTimeout(function () { d.classList.add('oculto'); }, 2800);
  }
  function marcar() {
    sucio = true;
    var e = $('#estado'); e.textContent = '● Cambios sin guardar'; e.className = 'sucio';
  }
  function limpio() {
    sucio = false;
    var e = $('#estado'); e.textContent = 'Todo guardado ✓'; e.className = '';
  }
  window.addEventListener('beforeunload', function (e) { if (sucio) { e.preventDefault(); e.returnValue = ''; } });

  /* ---------------- ingreso ---------------- */
  $('#fLogin').onsubmit = async function (e) {
    e.preventDefault();
    $('#lErr').textContent = ''; $('#lBtn').disabled = true; $('#lBtn').textContent = 'Ingresando…';
    var r = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lPass').value });
    $('#lBtn').disabled = false; $('#lBtn').textContent = 'Ingresar';
    if (r.error) { $('#lErr').textContent = 'Correo o contraseña incorrectos.'; return; }
    entrar(r.data.user);
  };
  async function entrar(u) {
    if (!u || String(u.email).toLowerCase() !== ADMIN) {
      await sb.auth.signOut();
      $('#lErr').textContent = 'Esta cuenta no es administradora del asistente.';
      return;
    }
    usuario = u;
    $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
    await cargar();
  }
  sb.auth.getSession().then(function (r) { if (r.data.session) entrar(r.data.session.user); });

  /* ---------------- datos ---------------- */
  async function cargar() {
    var r = await sb.from('chatbot_config').select('config, actualizado').eq('id', 'principal').maybeSingle();
    if (r.error) { aviso('No se pudo cargar la configuración: ' + r.error.message, true); }
    var base = DLChat.defecto();
    var c = (r.data && r.data.config) || base;
    // completar campos que falten
    c.general = Object.assign(base.general, c.general || {});
    c.apps = c.apps || base.apps; c.orden_apps = c.orden_apps || base.orden_apps; c.problemas = c.problemas || base.problemas;
    guardado = copiar(c); draft = copiar(c); limpio();
    await cargarPendientes();
    await cargarCasos();
    await revisarAvisos();
    if (location.hash === '#casos') irA('casos'); else pintar();
    // revisar casos nuevos cada 30 segundos mientras la app esté abierta
    setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      var antes = casos.filter(function (x) { return !x.atendido; }).length;
      cargarCasos().then(function () {
        var ahora = casos.filter(function (x) { return !x.atendido; }).length;
        if (tab === 'casos' && $('#hoja').classList.contains('oculto') && ahora !== antes) pintar();
      });
    }, 30000);
  }
  async function cargarCasos() {
    var r = await sb.from('chatbot_casos').select('*').order('creado', { ascending: false }).limit(150);
    if (r.error) return;
    casos = r.data || [];
    var n = casos.filter(function (x) { return !x.atendido; }).length, g = $('#nCasos');
    g.textContent = n; g.classList.toggle('oculto', !n);
  }
  function irA(t) {
    tab = t;
    document.querySelectorAll('nav button').forEach(function (x) { x.classList.toggle('on', x.dataset.t === t); });
    pintar(); window.scrollTo(0, 0);
  }
  if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.tipo === 'abrir-casos' && usuario) cargarCasos().then(function () { irA('casos'); });
  });

  /* ---------------- avisos al celular ---------------- */
  function llaveVapid(b64) {
    var pad = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length); for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i); return out;
  }
  function avisosPosibles() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  async function revisarAvisos() {
    avisosActivos = false;
    if (!avisosPosibles()) return;
    try {
      var reg = await navigator.serviceWorker.getRegistration('./');
      var sub = reg && await reg.pushManager.getSubscription();
      avisosActivos = !!sub && Notification.permission === 'granted';
    } catch (e) {}
  }
  async function activarAvisos() {
    if (!avisosPosibles()) { aviso('Este navegador no permite avisos. Usa Chrome en Android.', true); return; }
    var permiso = await Notification.requestPermission();
    if (permiso !== 'granted') { aviso('Debes permitir las notificaciones para recibir los avisos.', true); return; }
    try {
      var reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });
      await navigator.serviceWorker.ready;
      var sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: llaveVapid(VAPID) });
      var j = sub.toJSON();
      var r = await sb.from('chatbot_push_admin').upsert({ endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, ua: navigator.userAgent.slice(0, 200) });
      if (r.error) throw r.error;
      avisosActivos = true; pintar();
      await probarAviso(true);
    } catch (e) { aviso('No se pudieron activar los avisos: ' + (e.message || e), true); }
  }
  async function probarAviso(silencioso) {
    var ses = (await sb.auth.getSession()).data.session;
    try {
      var r = await fetch(URL_PUSH, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ses.access_token }, body: JSON.stringify({ test: true }) });
      var j = await r.json();
      aviso(j.ok && j.sent ? '🔔 Aviso de prueba enviado a este celular' : 'No se pudo enviar el aviso de prueba', !(j.ok && j.sent));
    } catch (e) { if (!silencioso) aviso('No se pudo enviar el aviso de prueba', true); }
  }
  async function cargarPendientes() {
    var r = await sb.from('chatbot_pendientes').select('id, creado, app, texto').order('creado', { ascending: false }).limit(200);
    pendientes = r.data || [];
    var n = $('#nPend'); n.textContent = pendientes.length; n.classList.toggle('oculto', !pendientes.length);
  }
  function validar() {
    var g = draft.general;
    if (String(g.whatsapp || '').replace(/\D/g, '').length < 10) return 'El número de WhatsApp debe tener indicativo y número (ej. 573218641539).';
    for (var i = 0; i < draft.problemas.length; i++) {
      var p = draft.problemas[i];
      if (!String(p.titulo || '').trim()) return 'Hay una respuesta sin título (#' + (i + 1) + ').';
      if (!String(p.respuesta || '').trim()) return 'La respuesta "' + p.titulo + '" no tiene texto.';
      if (!p.claves || !p.claves.length) return 'La respuesta "' + p.titulo + '" no tiene palabras clave.';
    }
    return null;
  }
  $('#bGuardar').onclick = async function () {
    var err = validar(); if (err) { aviso(err, true); return; }
    var b = this; b.disabled = true; b.textContent = 'Guardando…';
    draft.general.whatsapp = String(draft.general.whatsapp).replace(/\D/g, '');
    var r = await sb.from('chatbot_config').upsert({ id: 'principal', config: draft, actualizado: new Date().toISOString(), actualizado_por: usuario.email });
    b.disabled = false; b.textContent = '💾 Guardar';
    if (r.error) { aviso('No se pudo guardar: ' + r.error.message, true); return; }
    guardado = copiar(draft); limpio();
    aviso('✅ Guardado. Ya se aplica en la web y en todas las apps.');
  };
  // Probar como si el cliente viniera de una app o de la página web
  $('#bProbar').onclick = function () {
    var ops = [['web', '🌐 Página web']].concat(Object.keys(draft.apps).map(function (k) { return [k, draft.apps[k].icono + ' ' + draft.apps[k].nombre]; }));
    abrirHoja('<div class="hoja-cab"><h3>▶ Probar el chat</h3><button class="btn peq" data-a="cerrar">✕</button></div>' +
      '<p class="ayuda">¿Desde dónde escribe el cliente? El chat responderá <b>solo</b> con lo de esa app, igual que en la vida real.</p>' +
      '<div class="lista">' + ops.map(function (o) { return '<button type="button" class="item" data-origen="' + o[0] + '" style="width:100%;text-align:left"><div class="txt"><b>' + esc(o[1]) + '</b></div><span class="flecha">›</span></button>'; }).join('') + '</div>',
      function (hoja) {
        hoja.querySelectorAll('[data-origen]').forEach(function (b) {
          b.onclick = function () {
            cerrarHoja();
            DLChat.usarConfig(copiar(draft));
            DLChat.abrirComo(b.dataset.origen);
          };
        });
      });
  };

  /* ---------------- navegación ---------------- */
  document.querySelectorAll('nav button').forEach(function (b) {
    b.onclick = function () { irA(b.dataset.t); if (b.dataset.t === 'casos') cargarCasos().then(function () { if (tab === 'casos') pintar(); }); };
  });
  function pintar() {
    var v = $('#vista');
    if (tab === 'casos') v.innerHTML = vistaCasos();
    if (tab === 'respuestas') v.innerHTML = vistaRespuestas();
    if (tab === 'apps') v.innerHTML = vistaApps();
    if (tab === 'pendientes') v.innerHTML = vistaPendientes();
    if (tab === 'ajustes') v.innerHTML = vistaAjustes();
    enlazar(v);
  }
  function nombreApp(k) { return k === '*' ? 'Todas las apps' : (draft.apps[k] ? draft.apps[k].nombre : k); }

  /* ---------------- CASOS ---------------- */
  function fechaCorta(iso) { return new Date(iso).toLocaleString('es-CO', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }
  function vistaCasos() {
    var pend = casos.filter(function (x) { return !x.atendido; }).length;
    var h = '<h2>📥 Casos</h2><p class="ayuda">Clientes que el asistente pasó a tu WhatsApp. Aquí ves el resumen y toda la conversación, ' +
      'aunque el cliente no te lo envíe. En su mensaje de WhatsApp aparece el <b>código del caso</b> para que sepas cuál es.</p>';
    h += avisosActivos
      ? '<div class="bloque"><b>🔔 Avisos activos en este celular</b><p class="ayuda" style="margin:6px 0 10px">Te llega una notificación cada vez que un cliente pasa a WhatsApp.</p>' +
        '<button class="btn peq" data-a="probarAviso">Enviar aviso de prueba</button></div>'
      : '<div class="bloque"><b>🔔 Recibe un aviso cuando alguien te vaya a escribir</b><p class="ayuda" style="margin:6px 0 10px">Actívalo en el celular donde quieres recibir los avisos (funciona aunque esta página esté cerrada).</p>' +
        '<button class="btn oro" data-a="activarAvisos" style="width:100%">🔔 Activar avisos en este celular</button></div>';
    h += '<div class="chips" style="margin-bottom:12px">' +
      [['pendientes', 'Pendientes (' + pend + ')'], ['atendidos', 'Atendidos'], ['todos', 'Todos']].map(function (x) {

        if (a === 'agregarPlan') { e.preventDefault(); draft.apps[b.dataset.k].planes.push({ id: '', n: '', p: 0, inc: '' }); marcar(); pintarAbierta(b.dataset.k); }
        if (a === 'quitarPlan') { e.preventDefault(); draft.apps[b.dataset.k].planes.splice(Number(b.dataset.j), 1); marcar(); pintarAbierta(b.dataset.k); }
        if (a === 'crearDe') {
          var q = pendientes[i];
          editarRespuesta(null, { titulo: '', apps: q.app && draft.apps[q.app] ? [q.app] : ['*'], claves: [norm(q.texto).split(' ').slice(0, 6).join(' ')], respuesta: '', _pend: q.id });
        }
        if (a === 'borrarPend') borrarPendiente(pendientes[i].id);
        if (a === 'descartar') { draft = copiar(guardado); limpio(); pintar(); aviso('Cambios descartados'); }
        if (a === 'fabrica') {
          if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = '¿Seguro? Toca otra vez'; return; }
          draft.problemas = DLChat.defecto().problemas; marcar(); pintar(); aviso('Respuestas originales cargadas. Toca 💾 Guardar para aplicarlas.');
        }
        if (a === 'salir') { if (sucio && !b.dataset.ok) { b.dataset.ok = 1; b.textContent = 'Hay cambios sin guardar. ¿Salir igual?'; return; } sucio = false; sb.auth.signOut().then(function () { location.reload(); }); }
      });
    });
    // interruptores de apps y ajustes
    v.querySelectorAll('.interruptor[data-sw]').forEach(function (s) {
      s.onclick = function () {
        s.classList.toggle('on'); var on = s.classList.contains('on'), t = s.dataset.sw;
        if (t === 'activo') draft.general.activo = on;
        else if (t === 'botonWa') draft.general.botonWhatsApp = on;
        else {
          var k = s.closest('details').dataset.k;
          if (t === 'menu') { draft.orden_apps = draft.orden_apps.filter(function (x) { return x !== k; }); if (on) draft.orden_apps.push(k); }
          if (t === 'anual') { if (on) delete draft.apps[k].sinAnual; else draft.apps[k].sinAnual = true; }
          if (t === 'codigo') { if (on) delete draft.apps[k].sinCodigo; else draft.apps[k].sinCodigo = true; }
        }
        marcar();
      };
    });
    // campos de apps
    v.querySelectorAll('details.app [data-f]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var k = inp.closest('details').dataset.k, f = inp.dataset.f;
        draft.apps[k][f] = inp.dataset.lista ? inp.value.split(',').map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean) : (inp.value.trim() ? inp.value : null);
        marcar();
      });
    });
    v.querySelectorAll('.plan [data-p]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var k = inp.closest('details').dataset.k, j = Number(inp.closest('.plan').dataset.j), p = draft.apps[k].planes[j], f = inp.dataset.p;
        if (f === 'p' || f === 'antes') { var n = Math.round(Number(inp.value) || 0); if (f === 'antes' && !n) delete p.antes; else p[f] = n; }
        else p[f] = inp.value;
        if (f === 'n') p.id = norm(inp.value).split(' ')[0] || ('plan' + j);
        marcar();
      });
    });
    // ajustes generales
    v.querySelectorAll('[data-g]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        draft.general[inp.dataset.g] = inp.dataset.num ? Math.min(10, Math.max(2, Math.round(Number(inp.value) || 3))) : inp.value; marcar();
      });
    });
  }
  function pintarAbierta(k) { pintar(); var d = $('details.app[data-k="' + k + '"]'); if (d) d.open = true; }

  async function borrarPendiente(id) {
    var r = await sb.from('chatbot_pendientes').delete().eq('id', id);
    if (r.error) { aviso('No se pudo borrar: ' + r.error.message, true); return; }
    await cargarPendientes(); pintar();
  }
  // al crear una respuesta desde una pregunta pendiente, borrar la pendiente
  var resolverOriginal = editarRespuesta;
  editarRespuesta = function (i, nueva) {
    resolverOriginal(i, nueva);
    if (nueva && nueva._pend) {
      var idPend = nueva._pend;
      var btn = document.querySelector('#hoja [data-a="guardarResp"]'), viejo = btn.onclick;
      btn.onclick = function () {
        var antes = draft.problemas.length; viejo.call(btn);
        if (draft.problemas.length > antes) { delete draft.problemas[0]._pend; borrarPendiente(idPend); }
      };
    }
  };
})();
</script>
</body>
</html>
