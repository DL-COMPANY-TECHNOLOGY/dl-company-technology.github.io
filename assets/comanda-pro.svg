<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16244a"/><stop offset=".55" stop-color="#0a1226"/><stop offset="1" stop-color="#04070f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#8f6a0c"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dc85"/><stop offset="1" stop-color="#a87f16"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef0ff"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hand" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="270">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <!-- fondo -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="150" fill="#3b82f6" opacity=".22" filter="url(#soft)"/>
  <rect x="10" y="10" width="492" height="492" rx="110" fill="none" stroke="url(#gold)" stroke-width="8" opacity=".95"/>

  <g transform="translate(256 270) scale(1.12) translate(-256 -264)">
  <!-- plato visto desde arriba = reloj -->
  <circle cx="256" cy="264" r="150" fill="#0b1430" stroke="url(#gold)" stroke-width="20"/>
  <circle cx="256" cy="264" r="112" fill="none" stroke="#d4af37" stroke-opacity=".35" stroke-width="3"/>
  <!-- marcas horarias -->
  <g fill="#d4af37">
        <circle cx="386" cy="264" r="6"/><circle cx="256" cy="394" r="6"/><circle cx="126" cy="264" r="6"/>
  </g>
  <g fill="#d4af37" opacity=".55">
    <circle cx="321" cy="151.4" r="3.5"/><circle cx="368.6" cy="199" r="3.5"/><circle cx="368.6" cy="329" r="3.5"/><circle cx="321" cy="376.6" r="3.5"/>
    <circle cx="191" cy="376.6" r="3.5"/><circle cx="143.4" cy="329" r="3.5"/><circle cx="143.4" cy="199" r="3.5"/><circle cx="191" cy="151.4" r="3.5"/>
  </g>

  <!-- manecillas: tenedor (12) y cuchillo (2) = plato a tiempo -->
  <g filter="url(#glow)">
    <!-- cuchillo -->
    <g transform="rotate(62 256 264)">
      <path d="M249 268 V196 Q249 150 270 132 Q276 128 276 136 V268 Z" fill="url(#neon)"/>
    </g>
    <!-- tenedor -->
    <g stroke="url(#hand)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M256 266 V200" stroke-width="16"/>
      <path d="M231 128 V170 Q231 199 256 201 Q281 199 281 170 V128" stroke-width="10"/>
      <path d="M247.5 128 V176 M264.5 128 V176" stroke-width="8"/>
    </g>
  </g>
  <circle cx="256" cy="264" r="19" fill="url(#goldB)"/>
  <circle cx="256" cy="264" r="7" fill="#0b1430"/>

  </g>
  <!-- aviso en vivo -->
  <circle cx="404" cy="110" r="46" fill="#22e4ff" opacity=".18"/>
  <circle cx="404" cy="110" r="31" fill="url(#neon)" stroke="#0a1226" stroke-width="10"/>
  <circle cx="395" cy="101" r="8" fill="#fff" opacity=".55"/>
</svg>
